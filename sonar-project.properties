# sonar-project.properties
# Configuracion del analisis de SonarQube para envios-service.
#
# Ojo: este archivo lo lee el scanner de linea de comandos (sonar-scanner).
# Con "mvn sonar:sonar" el scanner de Maven lo ignora y toma los mismos
# valores de las <properties> del pom.xml, por eso estan duplicados alla.
# Si se cambia algo aqui hay que cambiarlo tambien en el pom.xml.

# Identificacion del proyecto en SonarQube
sonar.projectKey=com.universidad:envios-service
sonar.projectName=Envios Service
sonar.projectVersion=1.0

# Codigo fuente, pruebas y clases compiladas que se analizan
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes

# Reporte XML de JaCoCo que genera "mvn clean verify"
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# Servidor local levantado con Docker (Decision de diseno 1)
sonar.host.url=http://localhost:9000

# No se espera el resultado del Quality Gate al terminar el analisis
sonar.qualitygate.wait=false

# Exclusiones (Decision de diseno 2): no se excluye ninguna clase.
# El proyecto solo tiene logica de negocio, no hay clase Main, DTOs ni
# configuracion que distorsionen la cobertura.
# sonar.exclusions=
